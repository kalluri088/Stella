name: CI

# GitHub's runners are the only Windows and macOS machines this project
# has ever seen: the code core is portable but the process and path
# plumbing used to be POSIX-only, and the checks that matter off Linux
# (the modules import at all, and the fake-based platform decisions)
# cannot be run from this repository's Linux host. Everything here is
# deliberately the same two commands the local definition of done uses.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Sync the environment
        run: uv sync

      # The suite must at least import on every platform; that is the
      # regression this matrix exists for. Tests whose subject is
      # genuinely POSIX-only skip themselves off POSIX.
      #
      # Stella's window is a Tk window, and Tk needs a GUI *session* —
      # which only Linux has here, once Xvfb provides it. macOS's runner
      # signs in over SSH with no console user, so Cocoa never reaches
      # WindowServer and the process dies inside the first update();
      # Windows gets far enough to draw but dies on clipboard access
      # (see the skip in tests/test_ui.py). Both crash the interpreter, so
      # on those two the window tests skip and the rest of the matrix still
      # proves portability. Under Xvfb they run for real — 74 of them,
      # which had never executed in any CI job before.
      - name: Provide an X server for the window tests
        if: runner.os == 'Linux'
        run: command -v Xvfb || sudo apt-get install -y --no-install-recommends xvfb

      - name: Test (Linux, with a display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest

      - name: Test
        if: runner.os != 'Linux'
        run: uv run pytest

      # The hole this job just had: with no display, every window test
      # skipped and the run still reported success, so the GUI went untested
      # for the whole life of the workflow. Skipping is therefore a failure
      # here, not a pass — if the X server above ever stops being provided,
      # this says so in one line instead of going quiet.
      - name: The window suite ran, it did not skip
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          summary="$(xvfb-run -a uv run pytest tests/test_ui.py -q 2>&1 | tail -1)"
          echo "$summary"
          case "$summary" in
            *skipped*) echo "::error::the Tk window suite skipped on Linux"
                       exit 1 ;;
            *failed*)  echo "::error::the Tk window suite failed"
                       exit 1 ;;
            *passed*)  echo "Tk window suite ran on Xvfb" ;;
            *)         echo "::error::the Tk window suite reported no result"
                       exit 1 ;;
          esac

      - name: Lint
        run: uv run ruff check .

  # The artifact people actually install. Nothing in the three-platform
  # matrix above proves that the wheel builds, installs into a clean
  # environment, or runs its own preflight — v1.4.0 shipped a wheel no job
  # had ever opened. This one builds it, installs it away from the source
  # tree, and then points the repository's own installer at the result.
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Build the wheel and sdist
        run: uv build --out-dir dist

      - name: Install the wheel into a clean environment
        run: |
          set -euo pipefail
          wheel="$(ls dist/stella-*-py3-none-any.whl)"
          echo "built $wheel"
          uv venv /tmp/installed
          uv pip install --python /tmp/installed/bin/python "$wheel[web]"
          /tmp/installed/bin/python -c \
            "import stella, importlib.metadata as m; assert stella.__version__ == m.version('stella')"
          /tmp/installed/bin/stella --version
          # doctor is the command the installer tells a user to run, so it
          # has to work on a machine with no Stella state and no model.
          /tmp/installed/bin/stella doctor --json |
            /tmp/installed/bin/python -c \
            "import json,sys; d=json.load(sys.stdin); assert d['checks']; assert all(c['state'] for c in d['checks'])"

      - name: The release artifacts contain no home paths and no secrets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, re, tarfile, zipfile

          hits = glob.glob("dist/stella-*-py3-none-any.whl")
          assert len(hits) == 1, hits
          wheel = hits[0]
          assert re.fullmatch(r"dist/stella-\d+\.\d+\.\d+-py3-none-any\.whl", wheel), wheel
          # What a build leak actually looks like: the building user's own
          # home path baked into a source file or a packaging record. A plain
          # absolute path is not a leak — app.py names /home/user and
          # /Users/user as the shapes it supports, and the jail's fake HOME is
          # /home/stella — so this compares against the runner's real home
          # instead of forbidding every path.
          home = os.path.expanduser("~").encode()
          assert home != b"", "no home to compare against"
          secret = re.compile(
              rb"sk-[A-Za-z0-9]{12,}|ghp_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY"
          )

          archive = zipfile.ZipFile(wheel)
          for name in archive.namelist():
              # Source files plus packaging metadata, and nothing else: no
              # docs, no tests, no dotfiles riding along into a wheel.
              assert name.endswith(".py") or name.startswith("stella-"), name
              body = archive.read(name)
              assert home not in body, name
              assert not secret.search(body), name
          wheel_count = len(archive.namelist())

          # The sdist is the one that shows a public repository everything it
          # keeps — docs, tests, workflows, the agent guide — so it gets the
          # same look. It is a release asset, and a personal path in a research
          # note is exactly what nobody wants published forever.
          sdists = glob.glob("dist/stella-*.tar.gz")
          assert len(sdists) == 1, sdists
          with tarfile.open(sdists[0]) as tar:
              sdist_count = 0
              for member in tar:
                  if not member.isfile():
                      continue
                  body = tar.extractfile(member).read()
                  assert home not in body, member.name
                  # A test that proves redaction has to name a secret, so the
                  # key-shape rule applies to everything the sdist ships
                  # *except* tests — the wheel holds no tests, so shipped code
                  # stays covered by both rules either way.
                  if "/tests/" not in member.name:
                      assert not secret.search(body), member.name
                  sdist_count += 1
          print(
              wheel_count, "wheel entries and", sdist_count,
              "sdist files: no build paths, no key shapes",
          )
          PY

      - name: The installer accepts the built wheel
        run: |
          set -euo pipefail
          wheel="$(ls dist/stella-*-py3-none-any.whl)"
          sha256sum "$wheel" | sed 's|dist/||' > "$wheel.sha256"
          STELLA_WHEEL="$wheel" STELLA_CHECK=1 sh ./install.sh

      # The README's one command, run exactly as a stranger types it. The step
      # above hands install.sh a local wheel; this one gives it nothing but the
      # public URL, so it proves the four things a first-time install actually
      # depends on: the raw file is fetchable at all (the repository is public
      # and HEAD is a real branch), the release resolves, its wheel and checksum
      # download and match, and what lands in ~/.local/bin really runs. The
      # address is a literal on purpose — deriving it from the repository this
      # workflow runs in would keep passing if the published one moved.
      - name: The published curl command installs a Stella that runs
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/kalluri088/Stella/HEAD/install.sh"
          curl -fsSL "$url" -o /tmp/install.sh
          # Resolve, download and verify the release as published, change
          # nothing — the cheapest full check of the release assets.
          STELLA_CHECK=1 sh /tmp/install.sh
          # Then the real thing. Minimal: the default extras bring the voice
          # stack, and a runner has no microphone to prove with anyway.
          STELLA_MINIMAL=1 sh /tmp/install.sh
          stella="$HOME/.local/bin/stella"
          released="$(curl -fsSI -o /dev/null -w '%{redirect_url}' \
            "https://github.com/kalluri088/Stella/releases/latest" |
            sed -n 's|.*/tag/v\([0-9][0-9.]*\)$|\1|p')"
          echo "installed: $("$stella" --version) — latest release: v$released"
          # Not the checkout's version: the release's. This proves the wheel
          # a user downloads is the one tagged, and it keeps meaning something
          # once master moves ahead of the published build.
          test "$("$stella" --version)" = "stella $released"
          "$stella" doctor --json >/dev/null
